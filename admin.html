
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Arctic Sentinel AI</title>
    
    <!-- FontAwesome for UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Link to the main Custom CSS for consistent theming -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Specific inline styles for Admin Panel layout -->
    <style>
        /* Admin Login Overlay Styles */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b1121;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .login-box {
            background-color: #151e32;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        
        .login-box h2 {
            color: #ffffff;
            margin-bottom: 20px;
        }
        
        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: #0b1121;
            border: 1px solid #334155;
            color: #ffffff;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
        }
        
        .login-box button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .login-box button:hover {
            background-color: #1d4ed8;
        }
        
        #error-msg {
            color: #ef4444;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        /* Admin Dashboard Styles */
        #admin-dashboard {
            display: none; /* Hidden until authenticated */
            padding: 30px;
            color: #ffffff;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
        }
        
        /* Table Styles for Logs */
        .logs-table-container {
            background-color: #151e32;
            border-radius: 12px;
            border: 1px solid #1e293b;
            overflow-x: auto;
            padding: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        
        th, td {
            padding: 15px;
            border-bottom: 1px solid #1e293b;
        }
        
        th {
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
        }
        
        td {
            font-size: 14px;
        }
        
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge.high { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .badge.medium { background-color: rgba(234, 179, 8, 0.2); color: #eab308; }
        .badge.low { background-color: rgba(34, 197, 94, 0.2); color: #22c55e; }
    </style>
</head>
<body>

    <!-- Security Gateway: Login Overlay -->
    <div id="login-overlay">
        <div class="login-box">
            <i class="fa-solid fa-user-shield" style="font-size: 40px; color: #2563eb; margin-bottom: 15px;"></i>
            <h2>Admin Gateway</h2>
            <p style="color: #94a3b8; margin-bottom: 25px; font-size: 14px;">Authorized Personnel Only</p>
            
            <input type="password" id="admin-password" placeholder="Enter Admin Password">
            <button onclick="verifyAdmin()">Authenticate Access</button>
            <p id="error-msg"><i class="fa-solid fa-triangle-exclamation"></i> Invalid credentials</p>
        </div>
    </div>

    <!-- Main Admin Dashboard Area -->
    <div id="admin-dashboard">
        <div class="admin-header">
            <div>
                <h1 style="font-size: 24px;"><i class="fa-solid fa-server"></i> System Dashboard</h1>
                <p style="color: #94a3b8; margin-top: 5px;">Arctic Sentinel AI - Route Query Logs</p>
            </div>
            <button onclick="logoutAdmin()" style="background: transparent; border: 1px solid #334155; color: white; padding: 8px 15px; border-radius: 6px; cursor: pointer;">
                <i class="fa-solid fa-right-from-bracket"></i> Disconnect
            </button>
        </div>

        <div class="logs-table-container">
            <h3><i class="fa-solid fa-clock-rotate-left"></i> Recent Route Searches</h3>
            <table id="logs-table">
                <thead>
                    <tr>
                        <th>Log ID</th>
                        <th>Timestamp</th>
                        <th>Start Location</th>
                        <th>End Location</th>
                        <th>Avg Risk %</th>
                        <th>Max Category</th>
                    </tr>
                </thead>
                <tbody id="logs-body">
                    <!-- Data will be dynamically injected here via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- JavaScript for Admin Logic -->
    <script>
        // Simple client-side protection for demonstration purposes
        // In a strict production environment, authentication would be validated via JWT tokens on the backend
        const SECRET_PASS = "admin123"; // You can change this password

        function verifyAdmin() {
            const passInput = document.getElementById('admin-password').value;
            const errorMsg = document.getElementById('error-msg');
            
            if (passInput === SECRET_PASS) {
                // Hide login overlay and show the dashboard
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                // Trigger the data fetch from FastAPI backend
                fetchLogs();
            } else {
                // Show error message and shake input
                errorMsg.style.display = 'block';
                document.getElementById('admin-password').value = '';
            }
        }

        function logoutAdmin() {
            // Hide dashboard and show login screen again
            document.getElementById('admin-dashboard').style.display = 'none';
            document.getElementById('login-overlay').style.display = 'flex';
            document.getElementById('admin-password').value = '';
            document.getElementById('error-msg').style.display = 'none';
        }

        // Add Enter key event listener for the password input
        document.getElementById("admin-password").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                verifyAdmin();
            }
        });

        // Fetch logs from the FastAPI backend endpoint
        async function fetchLogs() {
            try {
                // Assuming the backend is running on localhost for now
                // Change this URL if deploying to Render/Vercel
                const response = await fetch('http://127.0.0.1:8000/api/admin/logs');
                const data = await response.json();
                
                if (data.status === "success") {
                    populateTable(data.logs);
                }
            } catch (error) {
                console.error("Failed to fetch logs:", error);
            }
        }

        function populateTable(logs) {
            const tbody = document.getElementById('logs-body');
            tbody.innerHTML = ''; // Clear existing rows
            
            logs.forEach(log => {
                const tr = document.createElement('tr');
                
                // Determine the correct CSS class for the risk badge
                let badgeClass = 'low';
                if (log.category === 'High Risk') badgeClass = 'high';
                if (log.category === 'Medium Risk') badgeClass = 'medium';
                
                // Format the timestamp to be more readable
                const dateObj = new Date(log.time);
                const timeString = dateObj.toLocaleString();

                tr.innerHTML = `
                    <td>#${log.id}</td>
                    <td style="color: #94a3b8;">${timeString}</td>
                    <td style="font-weight: 500;">${log.start}</td>
                    <td style="font-weight: 500;">${log.end}</td>
                    <td>${log.avg_risk}%</td>
                    <td><span class="badge ${badgeClass}">${log.category}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
